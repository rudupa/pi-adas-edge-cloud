# ALSA configuration for Adafruit Voice Bonnet (WM8960 codec)

pcm.!default {
    type asym
    playback.pcm "wm8960_out"
    capture.pcm  "wm8960_in"
}

pcm.wm8960_out {
    type plug
    slave {
        pcm "hw:0,0"
        rate 48000
        channels 2
        format S16_LE
    }
}

pcm.wm8960_in {
    type plug
    slave {
        pcm "hw:0,0"
        rate 48000
        channels 2
        format S16_LE
    }
}

ctl.!default {
    type hw
    card 0
}
