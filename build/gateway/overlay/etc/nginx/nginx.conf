worker_processes 1;
error_log /var/log/nginx/error.log;

events {
    worker_connections 64;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name adas-gateway.local;

        root /var/www/html;
        index index.html;

        location /api/status {
            proxy_pass http://127.0.0.1:8080/status;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
