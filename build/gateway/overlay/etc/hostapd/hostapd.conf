interface=wlan0
driver=nl80211
ssid=ADAS-GATEWAY
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
# SECURITY: Set the WPA2 passphrase at provisioning time, e.g.:
#   sed -i "s/CHANGE_ME_AT_PROVISIONING/your-secret-passphrase/" /etc/hostapd/hostapd.conf
# Do NOT commit or ship a real passphrase in this file.
wpa_passphrase=CHANGE_ME_AT_PROVISIONING
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP
